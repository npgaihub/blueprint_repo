[project]
name = "app"
version = "0.1.0"
description = "KI Labs blueprint: FastAPI + Claude, deployed on Vercel"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "fastapi>=0.142.1",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests", "evals", "api"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
